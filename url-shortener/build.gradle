plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '3.3.4'
	id 'io.spring.dependency-management' version '1.1.6'
	id 'com.diffplug.spotless' version '6.25.0'
}

group = 'com.urlshortener'
version = '0.1.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	set('resilience4jVersion', '2.2.0')
	set('springdocVersion', '2.6.0')
	set('testcontainersVersion', '1.20.1')
}

dependencies {
	// Web / API
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

	// Persistence
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'

	// Caching
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.apache.commons:commons-pool2'

	// Security
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// Resilience / Observability
	implementation "io.github.resilience4j:resilience4j-spring-boot3:${resilience4jVersion}"
	implementation 'org.springframework.boot:spring-boot-starter-aop'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'

	// Structured/JSON logging (Logback encoder - see logback-spring.xml)
	implementation 'net.logstash.logback:logstash-logback-encoder:7.4'

	// Boilerplate reduction
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testImplementation 'com.h2database:h2'
	testImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"
	testImplementation "org.testcontainers:postgresql:${testcontainersVersion}"
	testImplementation 'com.redis:testcontainers-redis:2.2.4'
	// Polls for the async click-recording pipeline to complete in integration tests, instead of a fixed Thread.sleep.
	testImplementation 'org.awaitility:awaitility:4.2.2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jacoco {
	toolVersion = '0.8.12'
}

tasks.named('test') {
	useJUnitPlatform {
		// Testcontainers-backed tests are tagged "integration" (see AbstractIntegrationTest) so the
		// default `test` task - and everything that depends on it, like `check` - stays fast and
		// Docker-free; they run separately via the `integrationTest` task below.
		excludeTags 'integration'
	}
	finalizedBy jacocoTestReport
}

// Coverage from the unit-test task only; run `gradle integrationTest jacocoTestReport` to fold
// Testcontainers-backed coverage in too (report inputs already include both tasks' exec data).
jacocoTestReport {
	dependsOn test
	executionData fileTree(layout.buildDirectory).include('jacoco/test.exec', 'jacoco/integrationTest.exec')
	reports {
		xml.required = true
		html.required = true
	}
}

/**
 * Runs only the tests tagged "integration" (real Postgres/Redis via Testcontainers, so this
 * requires a working Docker daemon). Deliberately NOT wired into `check`/`build` so a plain
 * `gradle build` stays fast and doesn't require Docker; CI invokes this task explicitly as its
 * own pipeline stage instead.
 */
tasks.register('integrationTest', Test) {
	description = 'Runs Testcontainers-backed integration tests.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'integration'
	}
	shouldRunAfter test
	finalizedBy jacocoTestReport
}

spotless {
	java {
		target 'src/**/*.java'
		// Matches this codebase's existing tab-indentation convention rather than imposing an
		// opinionated reformatter (e.g. google-java-format), which defaults to spaces and would
		// rewrite every existing file.
		indentWithTabs()
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}
