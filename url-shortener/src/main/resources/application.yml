spring:
  application:
    name: url-shortener
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/urlshortener-dev}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1000ms}
      timeout: ${REDIS_COMMAND_TIMEOUT:500ms}
      lettuce:
        pool:
          enabled: true
          max-active: ${REDIS_POOL_MAX_ACTIVE:16}
          max-idle: ${REDIS_POOL_MAX_IDLE:16}
          min-idle: ${REDIS_POOL_MIN_IDLE:4}
          max-wait: ${REDIS_POOL_MAX_WAIT:500ms}
        shutdown-timeout: 200ms

app:
  rate-limit:
    limit-for-period: ${RATE_LIMIT_COUNT:20}
    # Higher allowance for callers resolved to PREMIUM via the X-Api-Key header - see ApiKeyService.
    premium-limit-for-period: ${RATE_LIMIT_PREMIUM_COUNT:200}
    period-seconds: ${RATE_LIMIT_PERIOD_SECONDS:60}
    fail-open: ${RATE_LIMIT_FAIL_OPEN:true}
  base-url: ${APP_BASE_URL:http://localhost:8080}
  link-expiry:
    # How often the background sweep flips ACTIVE links past expiresAt to EXPIRED. Purely
    # cosmetic/reporting - redirects already enforce expiry in real time regardless of this.
    sweep-interval-ms: ${LINK_EXPIRY_SWEEP_INTERVAL_MS:300000}
  snowflake:
    # Must be unique per running instance (0-1023) - see SnowflakeConfig.
    node-id: ${SNOWFLAKE_NODE_ID:0}
  cache:
    # Long-lived: link contents are near-immutable, and every mutation path evicts/refreshes explicitly.
    link-ttl-seconds: ${LINK_CACHE_TTL_SECONDS:21600}
    # Short-lived: bounds staleness of the read-aggregated click counters between explicit invalidations.
    analytics-ttl-seconds: ${ANALYTICS_CACHE_TTL_SECONDS:30}
  logging:
    # Service-layer calls at/above this are logged at WARN by PerformanceLoggingAspect.
    slow-call-threshold-ms: ${SLOW_CALL_THRESHOLD_MS:500}

resilience4j:
  circuitbreaker:
    instances:
      redisCache:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 300ms
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - org.springframework.data.redis.RedisConnectionFailureException
          - org.springframework.data.redis.RedisSystemException
          - java.util.concurrent.TimeoutException

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    max-http-form-post-size: 8KB
    max-swallow-size: 8KB
    connection-timeout: 5s
    threads:
      max: ${SERVER_TOMCAT_MAX_THREADS:200}
      min-spare: ${SERVER_TOMCAT_MIN_SPARE_THREADS:10}
    accept-count: 100
  max-http-request-header-size: 8KB

logging:
  level:
    root: INFO
    com.urlshortener: INFO
