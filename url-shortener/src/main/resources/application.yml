spring:
  application:
    name: url-shortener
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/urlshortener}
    username: ${DB_USERNAME:urlshortener}
    password: ${DB_PASSWORD:urlshortener}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

app:
  rate-limit:
    limit-for-period: ${RATE_LIMIT_COUNT:20}
    period-seconds: ${RATE_LIMIT_PERIOD_SECONDS:60}
    fail-open: ${RATE_LIMIT_FAIL_OPEN:true}
  base-url: ${APP_BASE_URL:http://localhost:8080}
  snowflake:
    # Must be unique per running instance (0-1023) - see SnowflakeConfig.
    node-id: ${SNOWFLAKE_NODE_ID:0}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    com.urlshortener: INFO
